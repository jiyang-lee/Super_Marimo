<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super_Marimo 테스트 페이지</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f2ea;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --accent-2: #b45309;
        --border: #d6d3cd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(180deg, #faf7f1 0%, var(--bg) 100%);
        color: var(--text);
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      h1, h2, p { margin: 0; }
      h1 { font-size: 28px; margin-bottom: 8px; }
      .sub { color: var(--muted); margin-bottom: 20px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(31, 41, 55, 0.06);
      }
      .card h2 { font-size: 18px; margin-bottom: 12px; }
      label {
        display: block;
        margin: 10px 0 6px;
        font-size: 14px;
        color: var(--muted);
      }
      input, textarea, button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 10px 12px;
        font: inherit;
      }
      textarea {
        min-height: 108px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .buttons {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      button {
        cursor: pointer;
        border: none;
        background: var(--accent);
        color: white;
        font-weight: 700;
      }
      button.secondary { background: var(--accent-2); }
      button.ghost { background: #374151; }
      .pill {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #d1fae5;
        color: #065f46;
        font-size: 12px;
        font-weight: 700;
      }
      .status { margin-top: 8px; font-size: 14px; color: var(--muted); }
      .output {
        white-space: pre-wrap;
        word-break: break-word;
        background: #0f172a;
        color: #e5e7eb;
        border-radius: 16px;
        padding: 16px;
        min-height: 300px;
      }
      .audio {
        width: 100%;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Super_Marimo 테스트 페이지</h1>
      <p class="sub">RP2040 단일 환경에서 health, wakeword, manual-test, voice/ask, voice-server /tts만 확인하는 최소 페이지입니다.</p>

      <div class="grid">
        <section class="card">
          <h2>공통 설정</h2>
          <div class="row">
            <div>
              <label for="apiBase">API 주소</label>
              <input id="apiBase" value="http://localhost:8000" />
            </div>
            <div>
              <label for="voiceBase">Voice 주소</label>
              <input id="voiceBase" value="http://localhost:8002" />
            </div>
          </div>

          <div class="row">
            <div>
              <label for="voiceAgentBase">Voice Agent 주소</label>
              <input id="voiceAgentBase" value="http://localhost:8003" />
            </div>
            <div>
              <label for="sessionId">session_id</label>
              <input id="sessionId" placeholder="비워두면 자동 생성" />
            </div>
          </div>

          <label for="deviceId">device_id</label>
          <input id="deviceId" value="rp2040" />

          <label for="text">text</label>
          <textarea id="text">안녕! 오늘은 기분이 어때?</textarea>

          <div class="buttons">
            <button id="healthBtn">health 확인</button>
            <button id="wakeBtn">wakeword 저장</button>
            <button class="secondary" id="manualBtn">manual-test 저장</button>
            <button class="ghost" id="askBtn">voice/ask 저장</button>
            <button id="talkBtn">voice/ask + TTS</button>
            <button class="secondary" id="ttsBtn">TTS만 재생</button>
          </div>

          <p class="status">현재 상태: <span class="pill" id="modePill">대기</span></p>
          <audio id="audioPlayer" class="audio" controls></audio>
        </section>

        <section class="card">
          <h2>응답</h2>
          <div class="output" id="output">{ "message": "아직 요청 전입니다." }</div>
        </section>
      </div>
    </div>

    <script>
      const apiBaseEl = document.getElementById("apiBase");
      const voiceBaseEl = document.getElementById("voiceBase");
      const voiceAgentBaseEl = document.getElementById("voiceAgentBase");
      const sessionIdEl = document.getElementById("sessionId");
      const deviceIdEl = document.getElementById("deviceId");
      const textEl = document.getElementById("text");
      const outputEl = document.getElementById("output");
      const modePillEl = document.getElementById("modePill");
      const audioPlayerEl = document.getElementById("audioPlayer");

      let currentAudioUrl = null;

      function originFromInput(input) {
        return input.value.trim().replace(/\/$/, "");
      }

      function setMode(text) {
        modePillEl.textContent = text;
      }

      function setOutput(value) {
        outputEl.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      async function fetchJson(url, options = {}) {
        const response = await fetch(url, options);
        const text = await response.text();
        let body;
        try {
          body = JSON.parse(text);
        } catch (_error) {
          body = text;
        }
        if (!response.ok) {
          throw new Error(typeof body === "string" ? body : JSON.stringify(body, null, 2));
        }
        return body;
      }

      async function postJson(baseEl, path, payload) {
        return fetchJson(`${originFromInput(baseEl)}${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      }

      async function runHealth() {
        const api = await fetchJson(`${originFromInput(apiBaseEl)}/health`);
        const voice = await fetchJson(`${originFromInput(voiceBaseEl)}/health`);
        const agent = await fetchJson(`${originFromInput(voiceAgentBaseEl)}/health`);
        setOutput({ api, voice, agent });
      }

      async function runWakeword() {
        const body = await postJson(apiBaseEl, "/events/wakeword", {
          device_id: deviceIdEl.value.trim() || "rp2040",
          trigger_source: "mic-listener",
          generated_text: "wakeword detected",
          played: false,
        });
        setOutput(body);
      }

      async function runManualTest() {
        const body = await postJson(apiBaseEl, "/events/manual-test", {
          device_id: deviceIdEl.value.trim() || "rp2040",
          trigger_source: "manual",
          generated_text: textEl.value.trim() || "manual test",
          played: false,
        });
        setOutput(body);
      }

      async function runVoiceAsk() {
        const body = await postJson(apiBaseEl, "/voice/ask", {
          text: textEl.value.trim() || "안녕! 오늘은 기분이 어때?",
          session_id: sessionIdEl.value.trim() || null,
          use_sensor_context: false,
        });
        if (body.session_id) {
          sessionIdEl.value = body.session_id;
        }
        setOutput(body);
        return body;
      }

      async function playTts(text) {
        const response = await fetch(`${originFromInput(voiceBaseEl)}/tts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!response.ok) {
          throw new Error(await response.text());
        }

        const blob = new Blob([await response.arrayBuffer()], {
          type: response.headers.get("content-type") || "audio/wav",
        });
        if (currentAudioUrl) {
          URL.revokeObjectURL(currentAudioUrl);
        }
        currentAudioUrl = URL.createObjectURL(blob);
        audioPlayerEl.src = currentAudioUrl;
        audioPlayerEl.play();
        return { tts: "played", text };
      }

      async function runTalkAndTts() {
        const body = await runVoiceAsk();
        const text = String(body.tts_text || body.llm_answer || body.answer || "").trim();
        if (!text) {
          throw new Error("voice/ask response has no text");
        }
        const tts = await playTts(text);
        setOutput({ ask: body, tts });
      }

      async function runTtsOnly() {
        const text = textEl.value.trim() || "안녕! 오늘은 기분이 어때?";
        const result = await playTts(text);
        setOutput(result);
      }

      document.getElementById("healthBtn").addEventListener("click", async () => {
        setMode("health");
        try {
          await runHealth();
          setMode("완료");
        } catch (error) {
          setMode("오류");
          setOutput(String(error));
        }
      });

      document.getElementById("wakeBtn").addEventListener("click", async () => {
        setMode("wakeword");
        try {
          await runWakeword();
          setMode("완료");
        } catch (error) {
          setMode("오류");
          setOutput(String(error));
        }
      });

      document.getElementById("manualBtn").addEventListener("click", async () => {
        setMode("manual-test");
        try {
          await runManualTest();
          setMode("완료");
        } catch (error) {
          setMode("오류");
          setOutput(String(error));
        }
      });

      document.getElementById("askBtn").addEventListener("click", async () => {
        setMode("voice/ask");
        try {
          await runVoiceAsk();
          setMode("완료");
        } catch (error) {
          setMode("오류");
          setOutput(String(error));
        }
      });

      document.getElementById("talkBtn").addEventListener("click", async () => {
        setMode("ask+tts");
        try {
          await runTalkAndTts();
          setMode("완료");
        } catch (error) {
          setMode("오류");
          setOutput(String(error));
        }
      });

      document.getElementById("ttsBtn").addEventListener("click", async () => {
        setMode("tts");
        try {
          await runTtsOnly();
          setMode("완료");
        } catch (error) {
          setMode("오류");
          setOutput(String(error));
        }
      });
    </script>
  </body>
</html>
