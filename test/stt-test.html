<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Marimo Quest</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky: #7ec0ee;
      --green: #2d7a32;
      --green-dark: #1b5e20;
      --gold: #fdd835;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
    body {
      background: #111;
      font-family: 'DotGothic16', 'Press Start 2P', monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .device {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 920px;
      background: var(--sky);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 4px solid #000;
    }
    @media (min-width: 500px) {
      .device { border: 6px solid #333; border-radius: 4px; height: 92vh; box-shadow: 0 0 0 8px #222, 0 0 40px rgba(0,0,0,0.5); }
    }
    .cloud {
      position: absolute;
      background: #fff;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
    }
    .c1 { width: 96px; height: 32px; top: 60px; left: 16px; }
    .c1::after { content:''; position:absolute; width: 48px; height: 48px; background:#fff; top: -24px; left: 12px; }
    .c1::before { content:''; position:absolute; width: 56px; height: 40px; background:#fff; top: -16px; left: 32px; }
    .c2 { width: 120px; height: 36px; top: 120px; right: 8px; }
    .c2::after { content:''; position:absolute; width: 56px; height: 56px; background:#fff; top: -28px; left: 16px; }
    .c2::before { content:''; position:absolute; width: 64px; height: 48px; background:#fff; top: -20px; left: 40px; }
    .hud {
      background: var(--green-dark);
      border-bottom: 4px solid #000;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      position: relative;
      z-index: 10;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
    }
    .hud-lives { display: flex; gap: 2px; color: #ff3d3d; font-size: 0.7rem; }
    .hud-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-size: 0.75rem; color: var(--gold); text-shadow: 2px 2px 0 #000;
      white-space: nowrap;
    }
    .hud-gem { color: #4fc3f7; font-size: 0.6rem; }
    .server-hud {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 4px;
      background: #000;
      color: #0f0;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      border-bottom: 2px solid #333;
      z-index: 10;
    }
    .action-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 10px;
      z-index: 10;
    }
    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 10px 16px;
      border: 2px solid #000;
      background: var(--gold);
      color: #000;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
    }
    .pixel-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
    .pixel-btn.blue { background: #42a5f5; color: #fff; }
    .pixel-btn.green { background: var(--green); color: #fff; }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
    }
    .chat-box::-webkit-scrollbar { width: 0; }
    .dialogue { display: flex; gap: 8px; max-width: 92%; }
    .dialogue.player { align-self: flex-end; flex-direction: row-reverse; }
    .dialogue.npc { align-self: flex-start; }
    .dialogue.system { align-self: center; }
    .pixel-avatar {
      width: 40px; height: 40px;
      background: var(--green);
      border: 2px solid #000;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
      flex-shrink: 0;
      position: relative;
    }
    .pixel-avatar::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      background: #fff;
      top: 10px; left: 8px;
      box-shadow: 14px 0 0 #fff, 0 14px 0 #fff, 14px 14px 0 #fff;
    }
    .pixel-avatar .face {
      position: absolute;
      width: 4px; height: 4px;
      background: #000;
      top: 14px; left: 10px;
      box-shadow: 12px 0 0 #000, 6px 8px 0 #ff8a80;
    }
    .pixel-bubble {
      padding: 10px 12px;
      border: 2px solid #000;
      font-size: 0.85rem;
      line-height: 1.5;
      word-break: keep-all;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
    }
    .pixel-bubble.player { background: var(--gold); color: #000; }
    .pixel-bubble.npc { background: #fff; color: #000; }
    .pixel-bubble.system { background: rgba(0,0,0,0.75); color: #fff; font-size: 0.75rem; text-align: center; border: 2px solid #fff; }
    .msg-meta { font-family: 'Press Start 2P', monospace; font-size: 0.45rem; color: #555; margin-top: 4px; text-align: right; }
    .tts-action {
      margin-top: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      padding: 4px 8px;
      background: #e3f2fd;
      border: 2px solid #000;
      cursor: pointer;
      box-shadow: 2px 2px 0 #000;
    }
    .tts-action:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
    .input-hud {
      background: #222;
      border-top: 4px solid #000;
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 10;
    }
    .pixel-input {
      flex: 1;
      font-family: 'DotGothic16', monospace;
      font-size: 0.9rem;
      padding: 10px;
      border: 2px solid #000;
      outline: none;
      background: #fff;
      color: #000;
    }
    .pixel-input:focus { background: #ffffe0; }
    .icon-pixel {
      width: 44px; height: 44px;
      border: 2px solid #000;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000;
      flex-shrink: 0;
    }
    .icon-pixel:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
    .icon-pixel.mic { background: #ff5252; font-size: 1.3rem; }
    .icon-pixel.mic.recording { background: #1a7f37; animation: blink 0.6s steps(1) infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .icon-pixel.send { background: var(--green); color: #fff; font-size: 1.1rem; }
    .bottom-menu {
      background: var(--green-dark);
      border-top: 4px solid #000;
      display: flex;
      justify-content: space-around;
      padding: 6px 0 10px;
      z-index: 10;
    }
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none; border: none;
      color: rgba(255,255,255,0.7);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      cursor: pointer;
      padding: 4px;
    }
    .menu-item:hover, .menu-item.active { color: var(--gold); }
    .menu-icon { font-size: 1.4rem; }
    .pixel-toast {
      position: absolute;
      top: 80px; left: 50%; transform: translateX(-50%);
      background: #000;
      color: #fff;
      padding: 10px 16px;
      border: 2px solid #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      z-index: 20;
      display: none;
      white-space: nowrap;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    }
    .pixel-spinner {
      display: inline-block;
      width: 10px; height: 10px;
      background: #0f0;
      margin-right: 6px;
      animation: pix-spin 0.6s steps(4) infinite;
    }
    @keyframes pix-spin { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .scanlines {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <header class="hud">
      <div class="hud-lives">♥ ♥ ♥</div>
      <div class="hud-title">MARIMO QUEST</div>
      <div class="hud-gem">♦ 3</div>
    </header>
    <div class="server-hud">
      <span id="voiceStatus">VOICE ...</span>
      <span id="llmStatus">LLM ...</span>
    </div>
    <div class="action-row">
      <button class="pixel-btn blue" id="questBtn">QUEST</button>
      <button class="pixel-btn green" id="talkBtn">TALK</button>
    </div>
    <div id="pipelineToast" class="pixel-toast"></div>
    <div id="chatBox" class="chat-box"></div>
    <div class="input-hud">
      <input id="textInput" class="pixel-input" type="text" placeholder="메시지 입력..." />
      <button id="micBtn" class="icon-pixel mic" title="누르고 말하기">🎤</button>
      <button id="sendBtn" class="icon-pixel send">▶</button>
    </div>
    <nav class="bottom-menu">
      <button class="menu-item active" onclick="alert('🏠 HOME')"><span class="menu-icon">🏠</span><span>HOME</span></button>
      <button class="menu-item" onclick="alert('🔍 MAP')"><span class="menu-icon">🔍</span><span>MAP</span></button>
      <button class="menu-item" onclick="alert('💎 ITEM')"><span class="menu-icon">💎</span><span>ITEM</span></button>
      <button class="menu-item" onclick="alert('📋 LOG')"><span class="menu-icon">📋</span><span>LOG</span></button>
      <button class="menu-item" onclick="alert('⚙️ OPT')"><span class="menu-icon">⚙️</span><span>OPT</span></button>
    </nav>
    <div class="scanlines"></div>
  </div>

  <script>
    const VOICE = "http://localhost:8002";
    const LLM = "http://localhost:8001";
    const chatBox = document.getElementById("chatBox");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const toastEl = document.getElementById("pipelineToast");
    const voiceStatus = document.getElementById("voiceStatus");
    const llmStatus = document.getElementById("llmStatus");
    const questBtn = document.getElementById("questBtn");
    const talkBtn = document.getElementById("talkBtn");
    let recorder = null;
    let chunks = [];
    let history = [];
    let busy = false;

    function esc(s) { return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
    function timeStr() { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
    function toast(html) { toastEl.innerHTML = html; toastEl.style.display = html ? "block" : "none"; }

    function addMsg(role, content, meta="") {
      const row = document.createElement("div");
      row.className = `dialogue ${role}`;
      let html = "";
      if (role === "npc") {
        html = `<div class="pixel-avatar"><div class="face"></div></div><div><div class="pixel-bubble npc">${esc(content)}<div class="msg-meta">${timeStr()}</div></div>`;
        if (meta) html += `<button class="tts-action" data-txt="${esc(content)}">▶ PLAY</button>`;
        html += `</div>`;
      } else if (role === "player") {
        html = `<div><div class="pixel-bubble player">${esc(content)}<div class="msg-meta">${timeStr()}</div></div></div>`;
      } else {
        html = `<div class="pixel-bubble system">${esc(content)}</div>`;
      }
      row.innerHTML = html;
      if (role === "npc" && meta) row.querySelector(".tts-action").addEventListener("click", e => doTts(e.target.dataset.txt));
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function checkHealth() {
      try {
        const r = await fetch(`${VOICE}/health`);
        const d = await r.json();
        voiceStatus.textContent = d.ok && d.stt_models?.fast?.loaded ? "VOICE OK" : "VOICE NG";
        voiceStatus.style.color = d.ok ? "#0f0" : "#f44";
      } catch (e) { voiceStatus.textContent = "VOICE NG"; voiceStatus.style.color = "#f44"; }
      try {
        const r = await fetch(`${LLM}/health`);
        const d = await r.json();
        llmStatus.textContent = d.ok && d.ready ? "LLM OK" : "LLM NG";
        llmStatus.style.color = d.ok ? "#0f0" : "#f44";
      } catch (e) { llmStatus.textContent = "LLM NG"; llmStatus.style.color = "#f44"; }
    }
    checkHealth();
    setInterval(checkHealth, 8000);

    async function startRec() {
      chunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => onRecDone();
      recorder.start();
      micBtn.classList.add("recording");
    }
    function stopRec() {
      if (recorder && recorder.state !== "inactive") { recorder.stop(); recorder.stream.getTracks().forEach(t => t.stop()); }
      micBtn.classList.remove("recording");
    }
    micBtn.addEventListener("mousedown", startRec);
    micBtn.addEventListener("mouseup", stopRec);
    micBtn.addEventListener("mouseleave", stopRec);
    micBtn.addEventListener("touchstart", e => { e.preventDefault(); startRec(); });
    micBtn.addEventListener("touchend", e => { e.preventDefault(); stopRec(); });

    async function blobToWav(blob) {
      const ab = await blob.arrayBuffer();
      const ctx = new AudioContext();
      const buf = await ctx.decodeAudioData(ab);
      const rate = 16000;
      const off = new OfflineAudioContext(1, Math.ceil(buf.duration * rate), rate);
      const src = off.createBufferSource();
      src.buffer = buf;
      src.connect(off.destination);
      src.start();
      return bufferToWav(await off.startRendering());
    }
    function bufferToWav(buf) {
      const ch = buf.numberOfChannels;
      const len = buf.length * ch * 2 + 44;
      const arr = new ArrayBuffer(len);
      const view = new DataView(arr);
      const writeStr = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      writeStr(view, 0, "RIFF");
      view.setUint32(4, 36 + buf.length * ch * 2, true);
      writeStr(view, 8, "WAVE");
      writeStr(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, ch, true);
      view.setUint32(24, buf.sampleRate, true);
      view.setUint32(28, buf.sampleRate * ch * 2, true);
      view.setUint16(32, ch * 2, true);
      view.setUint16(34, 16, true);
      writeStr(view, 36, "data");
      view.setUint32(40, buf.length * ch * 2, true);
      let off = 44;
      for (let i = 0; i < buf.length; i++) {
        for (let c = 0; c < ch; c++) {
          let s = buf.getChannelData(c)[i];
          s = Math.max(-1, Math.min(1, s));
          view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
          off += 2;
        }
      }
      return new Blob([arr], { type: "audio/wav" });
    }

    async function onRecDone() {
      if (busy) return;
      const raw = new Blob(chunks, { type: "audio/webm" });
      if (!raw.size) return;
      busy = true;
      try { await runPipe(raw); } finally { busy = false; }
    }

    async function runPipe(audioBlob) {
      const t0 = performance.now();
      toast('<span class="pixel-spinner"></span> WAV...');
      let wav;
      try { wav = await blobToWav(audioBlob); } catch (e) { toast('WAV FAIL'); return; }
      toast('<span class="pixel-spinner"></span> STT...');
      const tStt = performance.now();
      let txt;
      try {
        const fd = new FormData();
        fd.append("audio", wav, "rec.wav");
        const r = await fetch(`${VOICE}/stt?model=fast`, { method: "POST", body: fd });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || r.statusText);
        txt = d.text || "";
      } catch (e) { toast('STT FAIL'); return; }
      const sttMs = (performance.now() - tStt).toFixed(0);
      addMsg("player", txt || "(empty)", "");
      toast('STT OK > LLM...');
      const tLlm = performance.now();
      let ans;
      try {
        const r = await fetch(`${LLM}/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ question: txt, history }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || r.statusText);
        ans = d.answer || "";
      } catch (e) { toast('LLM FAIL ' + e.message); return; }
      const llmMs = (performance.now() - tLlm).toFixed(0);
      history.push({ role: "user", content: txt }, { role: "assistant", content: ans });
      if (history.length > 32) history = history.slice(-32);
      addMsg("npc", ans, `LLM ${llmMs}ms`);
      toast('LLM OK > TTS...');
      const tTts = performance.now();
      try { await doTts(ans); } catch (e) { toast('TTS FAIL'); return; }
      const ttsMs = (performance.now() - tTts).toFixed(0);
      toast(`DONE ${(performance.now() - t0).toFixed(0)}ms`);
      setTimeout(() => toast(""), 3000);
    }

    async function doTts(text) {
      const r = await fetch(`${VOICE}/tts`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "audio/wav" },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) throw new Error("TTS " + r.status);
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = new Audio(url);
      a.play();
      a.addEventListener("ended", () => URL.revokeObjectURL(url));
    }

    async function sendText() {
      const txt = textInput.value.trim();
      if (!txt) return;
      textInput.value = "";
      addMsg("player", txt, "");
      toast('<span class="pixel-spinner"></span> LLM...');
      const t0 = performance.now();
      let ans;
      try {
        const r = await fetch(`${LLM}/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ question: txt, history }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || r.statusText);
        ans = d.answer || "";
      } catch (e) { toast('LLM FAIL ' + e.message); return; }
      const ms = (performance.now() - t0).toFixed(0);
      history.push({ role: "user", content: txt }, { role: "assistant", content: ans });
      if (history.length > 32) history = history.slice(-32);
      addMsg("npc", ans, `LLM ${ms}ms`);
      toast('');
      await doTts(ans);
    }
    sendBtn.addEventListener("click", sendText);
    textInput.addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });
    questBtn.addEventListener("click", () => { textInput.value = "퀘스트 뭐 있어?"; sendText(); });
    talkBtn.addEventListener("click", () => { textInput.value = "안녕 마리모!"; sendText(); });
    addMsg("npc", "안녕! 나는 마리모야.\n무엇을 도와줄까?", "");
  </script>
</body>
</html>
